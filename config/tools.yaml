# Tool registry — the ONLY place capabilities are declared (CONVENTIONS.md).
# Risk: safe (runs immediately) | confirm ("Shall I proceed, sir?")
#       | pin (spoken 4-digit PIN) | blocked (refused).
# Risk policy: reading/finding/drafting = safe · anything that SENDS or posts
# on your behalf = confirm · phone calls in your voice/name = pin.
#
# n8n tools use adapter adapters.n8n:run + webhook_path. RULE: only Friday-owned
# n8n workflows — never a business/client workflow — and the webhook must be
# POST + headerAuth (X-Friday-Secret). None are registered right now (2026-09-29:
# the business demo tools were unlinked); `make doctor` fails if one is added
# whose path has no active POST workflow. Unbuilt ideas: README backlog.
tools:
  # Local capabilities (no credentials leave the Mac):
  - name: weather
    description: "tells the current weather, temperature, rain chances and today's forecast outside"
    adapter: adapters.weather:report
    risk: safe
  - name: reminder
    description: "sets a personal reminder or note-to-self when sir says 'remind me to ...'"
    adapter: integrations.reminders:remind
    risk: safe
  - name: calendar_today
    description: "reads today's calendar, schedule and upcoming events"
    adapter: adapters.calendar:today_summary
    risk: safe
  - name: calendar_event
    description: "creates a calendar event; books time, a meeting or appointment on sir's calendar"
    adapter: adapters.calendar:create_from_speech
    risk: confirm
  - name: metrics_report
    description: "reads Friday's own dashboard metrics aloud: wakes, tool runs and failures, camera looks, today's events"
    adapter: integrations.metrics_voice:report
    risk: safe
  - name: open_apps
    description: "opens sir's morning workspace — his apps and browser tabs (Instagram, GitHub, email, the Friday dashboard); say 'open my apps'. NOT for playing music"
    adapter: adapters.apps:launch
    risk: safe
  - name: spotify_play
    description: "controls Spotify music playback: play or resume songs, pause, skip/next, previous track, or what's playing now"
    adapter: adapters.spotify:control
    risk: safe
  - name: jobs_status
    description: "reports sir's job search: the latest job batch, roles approved/skipped/undecided, questions waiting on him, and the application tracker"
    adapter: integrations.jobs_voice:status
    risk: safe
  - name: open_obsidian
    description: "opens sir's notes vault in the Obsidian app, or one note by name ('open the note called ...'); NOT for answering questions from notes"
    adapter: adapters.vault:open_tool
    risk: safe
