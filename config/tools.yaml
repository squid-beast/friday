tools:
  # n8n capabilities (wired 2026-08-15 from the live workflow list; base URL =
  # tailnet n8n). Each needs its workflow ACTIVATED in the n8n editor to answer.
  - name: job_search
    description: "runs the job engine: searches job boards and scores/tailors matching roles for sir"
    adapter: adapters.n8n:run
    webhook_path: /webhook/job-run
    risk: confirm
  - name: review_draft
    description: "drafts a reply to a customer review for sir's approval; drafts only, sends nothing"
    adapter: adapters.n8n:run
    webhook_path: /webhook/review-in
    risk: safe
  - name: lead_intake
    description: "kicks off speed-to-lead: instant response sequence for a new lead"
    adapter: adapters.n8n:run
    webhook_path: /webhook/lead-intake
    risk: confirm
  - name: vendor_report
    description: "runs the vendor data report and returns the numbers"
    adapter: adapters.n8n:run
    webhook_path: /webhook/run-vendor-report
    risk: safe
  - name: maintenance_request
    description: "files a property maintenance request for triage and dispatch"
    adapter: adapters.n8n:run
    webhook_path: /webhook/maintenance-request
    risk: confirm

  # Phase D2 — local capabilities, live today (no credentials needed):
  - name: weather
    description: "tells the current weather, temperature, rain chances and today's forecast outside"
    adapter: adapters.weather:report
    risk: safe
  - name: reminder
    description: "sets a personal reminder or note-to-self when sir says 'remind me to ...'"
    adapter: integrations.reminders:remind
    risk: safe
  - name: calendar_today
    description: "reads today's calendar, schedule and upcoming events"
    adapter: adapters.calendar:today_summary
    risk: safe
  - name: calendar_event
    description: "creates a calendar event; books time, a meeting or appointment on sir's calendar"
    adapter: adapters.calendar:create_from_speech
    risk: confirm
  - name: metrics_report
    description: "reads business metrics from the dashboard: instagram reels, bookings, revenue and MRR, leads, workflow health"
    adapter: integrations.metrics_voice:report
    risk: safe
  - name: open_apps
    description: "opens sir's morning workspace — his apps and browser tabs (Instagram, GitHub, email, the Friday dashboard); say 'open my apps'. NOT for playing music"
    adapter: adapters.apps:launch
    risk: safe
  - name: spotify_play
    description: "controls Spotify music playback: play or resume songs, pause, skip/next, previous track, or what's playing now"
    adapter: adapters.spotify:control
    risk: safe
  - name: make_call
    description: "places a real phone call and speaks to someone on sir's behalf; dials a number and talks for him"
    adapter: adapters.telephony:call
    risk: pin
