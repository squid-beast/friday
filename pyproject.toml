[project]
name = "friday"
version = "0.1.0"
description = "Friday — local, voice-first personal assistant"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[anthropic,cartesia,deepgram,silero]~=1.2",
    "anthropic>=0.60",
    "pydantic>=2",
    "pydantic-settings>=2",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "chromadb>=1.5.9",
    "pyyaml>=6.0.3",
    "openwakeword>=0.4.0",
    "sounddevice>=0.5.5",
    "rumps>=0.4.0",
    "pynput>=1.8.2",
    "browser-use>=0.13.7",
    "moondream>=2.0.1",
    "pyobjc-framework-eventkit>=12.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["reference", "data"]

[tool.ruff.lint]
# The official standard: PEP 8 (E,W), pyflakes (F), import order (I, PEP 8),
# pep8-naming (N), modern 3.12 idioms (UP), bugbear (B), simplify (SIM), ruff (RUF).
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
